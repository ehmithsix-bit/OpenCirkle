
name: Build OpenCirkle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Project ZIP
        id: project
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          PACKAGE=$(find extracted -name package.json \
            -not -path '*/node_modules/*' -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            exit 1
          fi

          DIR=$(dirname "$PACKAGE")
          CAP=$(node -e "const p=require('./$PACKAGE'); console.log((p.dependencies||{})['@capacitor/android'] || (p.devDependencies||{})['@capacitor/android'] || '')")

          MAJOR=$(echo "$CAP" | sed -E 's/^[^0-9]*([0-9]+).*/\1/')

          JAVA=17
          if [ -n "$MAJOR" ] && [ "$MAJOR" -ge 7 ]; then
            JAVA=21
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}

      - name: Install and Build React
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCirkle-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
